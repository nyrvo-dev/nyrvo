name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go-version: ["1.25", "1.26"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Gofmt check
        run: |
          test -z "$(gofmt -l .)" || { echo "gofmt found unformatted files:"; gofmt -l .; exit 1; }

      - name: Test
        run: go test ./...

      - name: Test with race detector
        run: go test -race ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      # Lint runs once, on the development Go version: it checks the source, not
      # the toolchain, so repeating it across the test matrix would only add
      # duplicate findings and minutes.
      - name: golangci-lint
        # v7 is the first action release that can install golangci-lint v2;
        # v6 rejects the version string outright rather than falling back.
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
